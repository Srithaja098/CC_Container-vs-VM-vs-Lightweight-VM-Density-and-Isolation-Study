# ==============================================================================
# CloudSim 4.0 Isolation Study - Experiment Configuration
# Package: isolationstudy
# Study: Container vs VM vs Lightweight-VM Density and Isolation Study
# ==============================================================================

# Deterministic simulation seed
seed=42

# ------------------------------------------------------------------------------
# Physical Host Hardware Specifications (Single Host Base Configuration)
# ------------------------------------------------------------------------------
host.count=1
host.cores=16
host.mips_per_core=2500.0
host.ram_mb=65536
host.bw=10000000
host.storage_mb=1000000

# ------------------------------------------------------------------------------
# Base Application Instance Specifications (Identical workload sizing)
# ------------------------------------------------------------------------------
instance.vcpus=2
instance.mips_per_vcpu=2500.0
instance.app_ram_mb=256
instance.bw=1000
instance.image_size_mb=1000

# ------------------------------------------------------------------------------
# Start-up Delays (seconds from launch request until first cloudlet may execute)
# Calibration values matching reference benchmarks:
# Full VM: 30.0s (hypervisor + OS boot)
# Container: 2.0s (cgroup/namespace namespace setup)
# Lightweight VM: 3.8s (microVM / hypervisor-isolated container kernel boot)
# ------------------------------------------------------------------------------
startup.delay.full_vm_s=30.0
startup.delay.container_s=2.0
startup.delay.lightweight_vm_s=3.8

# ------------------------------------------------------------------------------
# CPU Virtualisation Overheads (% of guest execution time lost to virtualization)
# Full VM: 5.0% (KVM CPU virtualization tax)
# Container: 2.0% (Kernel namespace/cgroup scheduling overhead)
# Lightweight VM: 8.0% (Kata / gVisor guest kernel + VMM translation tax)
# ------------------------------------------------------------------------------
cpu.overhead.full_vm_pct=5.0
cpu.overhead.container_pct=2.0
cpu.overhead.lightweight_vm_pct=8.0

# ------------------------------------------------------------------------------
# Per-Instance Memory Overheads (MB added on top of application 256 MB)
# Calibration:
# Full VM: 512 MB overhead -> Footprint = 256 + 512 = 768 MB (Density = 65536 / 768 = 85 -> core-limited to 16/2 = 8)
# Container: 256 MB overhead -> Footprint = 256 + 256 = 512 MB (Density = 65536 / 512 = 128)
# Lightweight VM: 768 MB overhead -> Footprint = 256 + 768 = 1024 MB (Density = 65536 / 1024 = 64)
# ------------------------------------------------------------------------------
mem.overhead.full_vm_mb=512
mem.overhead.container_mb=256
mem.overhead.lightweight_vm_mb=768

# ------------------------------------------------------------------------------
# Experiment 2: Fleet Sizes for Startup Readiness Sweep (comma-separated)
# ------------------------------------------------------------------------------
fleet.sizes=1,8,16,32,64

# ------------------------------------------------------------------------------
# Experiment 3: Workload & Noisy-Neighbour Parameters
# ------------------------------------------------------------------------------
workload.victim_count=4
workload.victim_length_mi=100000
workload.neighbour_length_mi=1000000
workload.neighbour_intensity=8.0

# ------------------------------------------------------------------------------
# Experiment 4: Mixed Tenancy Uncore Contention Parameters (Memory & I/O)
# ------------------------------------------------------------------------------
mixed_tenancy.mem_contention_factor=0.15
mixed_tenancy.io_contention_factor=0.20

# host power model for the energy results (placeholders: replace with a cited SPECpower figure)
power.host.idle_w=100
power.host.max_w=300

